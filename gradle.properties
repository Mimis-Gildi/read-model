# @rdd13r 2026-08-21

kotlin.code.style=official
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

org.gradle.configuration-cache=true
org.gradle.isolated-projects=false
org.gradle.parallel=true
org.gradle.caching=true

org.gradle.warning.mode=summary

# :service packages the export, so it must be the static snapshot, not a fullstack site.
kobwebExportLayout=STATIC
# kobwebExport requires kobwebEnv=DEV, so pin the build target instead: RELEASE keeps the dev
# status-overlay bootstrap out of main(), which needs markup :service's index.html doesn't carry.
kobwebBuildTarget=RELEASE

org.gradle.jvmargs=--add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED -Xmx4g -Dfile.encoding=UTF-8

# Thangs that be before all other thangs
versionOfToolchainsFoojayResolver=1.0.0
versionOfKtor=3.5.2
versionOfJava=21

group=me.riddle.adventure.web
version=0.1.0
