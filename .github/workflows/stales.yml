name: "Stales Labeler"
run-name: "Stale Labeling ${{ github.repository }} by ${{ github.actor }} with ${{ github.event_name }} (Attempt ${{ github.run_attempt }})"

on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:

jobs:
  stales:
    uses: Mimis-Gildi/fluffle/.github/workflows/stales.yml@main
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      days-before-issue-stale: 180
      days-before-issue-close: 90
      days-before-pr-stale: 60
      days-before-pr-close: 30