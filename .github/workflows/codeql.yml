name: "code-ql-advanced"
run-name: "CodeQL scan on ${{ github.repository }} by ${{ github.actor }} with ${{ github.event_name }} (Attempt ${{ github.run_attempt }})"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'index/**'
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'index/**'
      - '**/*.md'
  schedule:
    - cron: '31 14 * * 6'
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Java
      if: matrix.build-mode == 'manual'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    # Cache stays off: a FROM-CACHE compile task never reaches the Kotlin extractor.
    - name: Setup Gradle
      if: matrix.build-mode == 'manual'
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.7.1'
        cache-disabled: true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    # Only JVM compilations are extracted; jsMain Kotlin is invisible to java-kotlin.
    # Excluding service resources keeps the JS variants and kobweb export out of the build.
    - name: Build JVM compilations
      if: matrix.build-mode == 'manual'
      run: gradle --no-build-cache --no-configuration-cache :model:compileTestKotlinJvm :service:compileTestKotlin -x :service:processResources

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

    - name: Report extracted Kotlin sources
      if: matrix.build-mode == 'manual'
      run: |
        SRC=$(find "$RUNNER_TEMP/codeql_databases" -name src.zip | head -1)
        {
          echo "## Extracted Kotlin sources"
          echo '```'
          unzip -Z1 "$SRC" | grep '\.kt$' | sed 's|^.*/read-model/read-model/||' | sort
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
