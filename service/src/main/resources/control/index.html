<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>read-model &mdash; Control Plane</title>
    <link rel="stylesheet" href="control.css">
</head>
<body>
<div style="max-width: 1080px; margin: 0 auto;">

    <header>
        <div>
            <h1><span class="monospaceSharedText">Read Model</span> - Control Plane</h1>
            <p class="tagline">
                <a href="https://mimis-gildi.github.io/riddle-me-this/adventures/2026/08/02/web-showdown.html"
                   target="_blank">
                    Web Showdown 2026.
                </a>
                <i>Torture a read model till we crash; get data.</i>
            </p>
        </div>
        <!-- Both attribute and text are ConnectionStatus.UNKNOWN; connect() overwrites them on the first tick. -->
        <div class="connectionStatusContainerStyle" id="connectionStatusComponent" data-state="unset">
            <span class="dot"></span><span id="connectionStatusText">unknown</span>
        </div>
    </header>

    <section>
        <h2>Launch</h2>
        <div class="cardContentSection">
            <div style="display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap;">
                <div class="fixtureLaunchField">
                    <label for="uiFramework">UI Framework</label>
                    <select id="uiFramework"></select>
                </div>
                <div class="fixtureLaunchField">
                    <label for="datasetKey">Dataset</label>
                    <select id="datasetKey"></select>
                </div>
                <button id="launchFixtureTestTab" type="button">Launch Run</button>
            </div>
            <!--suppress CheckEmptyScriptTag -->
            <div id="fixtureTabLaunchStatus" />
        </div>
    </section>

    <section>
        <h2>Results</h2>
        <div class="cardContentSection">
            <div style="overflow-x: auto;">
                <table id="performanceComparisonTable" hidden>
                    <thead>
                    <tr id="performanceTableHeader"></tr>
                    </thead>
                    <tbody id="performanceRowData"></tbody>
                    <tfoot id="performanceComparisonTableFooter"></tfoot>
                </table>
            </div>
            <div id="performanceTableStatusMessage"
                 style="padding: 2.5rem 1rem; text-align: center; color: var(--ink-dim);
                 font-family: var(--mono), monospace; font-size: 0.8125rem;">
                ... not yet initialized
            </div>
        </div>
    </section>

    <footer id="controlPlaneFooter">
        This is the Control Plane for Framework Fixture Benchmarks.
    </footer>

</div>

<!-- This is provided by far superior :control Kotlin component. -->
<!--suppress HtmlUnknownTarget -->
<script type="module" src="read-model-control.mjs"></script>
</body>
</html>
