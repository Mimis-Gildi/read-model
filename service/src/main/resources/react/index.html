<!doctype html>
<!--
  React fixture. Same page as the Pure JS one, down to the ids -- the harness reads its rungs off this table.

  Launched by the control plane as /react/?run=<uuid>&dataset=<key>.
  The page names no dataset of its own -- it renders whatever the URL sends it.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Read Model &mdash; React</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Shared with every fixture: the row shape is the contract that makes the columns comparable. -->
    <link rel="stylesheet" href="/harness/bench.css">
</head>
<body>

<header>
    <div class="head-top">
        <h1>React</h1>
        <div class="head-info">
            <dl>
                <dt>runId</dt>
                <dd id="runId">&ndash;</dd>
                <dt>datasetKey</dt>
                <dd id="datasetKey">&ndash;</dd>
            </dl>
        </div>
        <!-- Both attribute and text are ConnectionStatus.CONNECTING; the harness overwrites them on the first tick. -->
        <div class="connectionStatusContainerStyle" id="connection" data-state="wait">
            <span class="dot"></span><span id="connectionText">connecting</span>
        </div>
    </div>
    <hr>
    <div class="head-actions">
        <button id="buildStaticDOM" disabled>Build DOM</button>
        <!--
          Bulk gestures. Nothing to fold until a ladder has run, so they start disabled.
          One press of Expand Teams runs the whole chunked reveal: the button stays put and comes back when it is over.
        -->
        <button id="expandTeams" disabled>Expand Teams</button>
        <button id="collapseTeams" disabled>Collapse Teams</button>
    </div>
    <div class="head-status">
        <p id="status">Ready.</p>
    </div>
</header>

<!--
  One row per rung, filled as the ladder climbs and as the reveal unfolds. The titles in the first column are
  the addresses a report is filed under. The fixture reads them off these cells rather than holding a second
  copy of the names -- and they are the same titles the control-plane matrix rows carry.
-->
<table id="results">
    <thead>
    <tr>
        <th>Rung</th>
        <th>Nodes</th>
        <th>Elements</th>
        <th>Built</th>
        <th>Painted</th>
    </tr>
    </thead>
    <tbody id="rows">
    <tr id="level-0">
        <td>Divisions</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-1">
        <td>Groups</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-2">
        <td>Teams</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-3">
        <td>People</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    </tbody>
</table>

<!--
  Not a rung: there is no /data/<dataset>/4. This is the ladder's People rung finally being laid out,
  and it accumulates -- the row is rewritten after every chunk until the reveal finishes or the tab dies.
  Its own table because it measures something different: no build, just toggling classes on already-built DOM.
-->
<table id="reveal-results">
    <thead>
    <tr>
        <th>Rung</th>
        <th>Rows</th>
        <th>Toggled</th>
        <th>Painted</th>
    </tr>
    </thead>
    <tbody>
    <tr id="reveal">
        <td>Reveal</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    </tbody>
</table>

<hr>

<main id="tree"></main>

<!--Offered by the build. -->
<!--suppress HtmlUnknownTarget -->
<script type="module" src="react.js"></script>
</body>
</html>
