<!--
  Vanilla JS fixture. The baseline every other module is measured against.

  Launched by the control plane as /static/?run=<uuid>&module=vanilla&dataset=<key>.
  The page names no dataset of its own -- it renders whatever the URL sends it.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Read Model &mdash; Vanilla JS</title>
    <link rel="stylesheet" href="bench.css">
</head>
<body>

<header>
    <h1>Vanilla JS</h1>
    <dl>
        <dt>run</dt>
        <dd id="run">&ndash;</dd>
        <dt>dataset</dt>
        <dd id="datasetKey">&ndash;</dd>
    </dl>
    <button id="start" disabled>Run ladder</button>
    <!-- Bulk gestures. Nothing to fold until a ladder has run, so they start disabled. -->
    <button id="expandAll" disabled>Expand all</button>
    <button id="collapseAll" disabled>Collapse all</button>
    <p id="status">Ready.</p>
</header>

<!--
  One row per level of the read model, filled as the ladder climbs. The row titles are the same
  four the control-plane matrix uses, because they are the same four levels.
-->
<table id="results">
    <thead>
    <tr>
        <th>Level</th>
        <th>Nodes</th>
        <th>Elements</th>
        <th>Built</th>
        <th>Painted</th>
    </tr>
    </thead>
    <tbody id="rows">
    <tr id="level-0">
        <td>Divisions</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-1">
        <td>Groups</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-2">
        <td>Teams</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-3">
        <td>People</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    </tbody>
</table>

<main id="tree"></main>

<script src="bench.js"></script>
</body>
</html>
