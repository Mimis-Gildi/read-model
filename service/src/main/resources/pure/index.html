<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Read Model &mdash; Pure JS</title>
    <link rel="stylesheet" href="/harness/bench.css">
</head>
<body>

<header>
    <h1>Pure JS</h1>
    <dl>
        <dt>runId</dt>
        <dd id="runId">&ndash;</dd>
        <dt>datasetKey</dt>
        <dd id="datasetKey">&ndash;</dd>
    </dl>
    <button id="buildStaticDOM" disabled>Build DOM</button>
    <button id="expandAll" disabled>Expand all</button>
    <button id="collapseAll" disabled>Collapse all</button>
    <p id="status">Ready.</p>
</header>

<table id="results">
    <thead>
    <tr>
        <th>Rung</th>
        <th>Nodes</th>
        <th>Elements</th>
        <th>Built</th>
        <th>Painted</th>
    </tr>
    </thead>
    <tbody id="rows">
    <tr id="level-0">
        <td>Divisions</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-1">
        <td>Groups</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-2">
        <td>Teams</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    <tr id="level-3">
        <td>People</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    </tbody>
</table>

<table id="reveal-results">
    <thead>
    <tr>
        <th>Rung</th>
        <th>Rows</th>
        <th>Toggled</th>
        <th>Painted</th>
    </tr>
    </thead>
    <tbody>
    <tr id="reveal">
        <td>Reveal</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
        <td>&ndash;</td>
    </tr>
    </tbody>
</table>

<hr>

<main id="tree"></main>

<!--suppress HtmlUnknownTarget -->
<script type="module" src="pure.js"></script>
</body>
</html>
